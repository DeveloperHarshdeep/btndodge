<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050810">
<meta name="description" content="Catch Me If You Can — interactive web experiment by HD Web Studios.">
<title>Catch Me If You Can | HD Web Studios</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#050810;color:#fff;font-family:Inter,system-ui,sans-serif}
a{color:inherit;text-decoration:none}.wrap{width:min(820px,92vw);margin:auto;text-align:center;padding:18px 0 24px}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:38px}.brand{display:flex;align-items:center;gap:9px;font-weight:850;font-size:13px}.logo{width:38px;height:38px;border-radius:11px;object-fit:cover;box-shadow:0 6px 22px #008cff44}.brand span{color:#45d9ff}.site{font-size:12px;color:#758197}
.badge{display:inline-block;padding:7px 12px;border:1px solid #ffffff18;border-radius:99px;color:#45d9ff;font-size:10px;font-weight:800;letter-spacing:.5px}
h1{font-size:clamp(40px,7vw,68px);line-height:.96;letter-spacing:-3px;margin:18px 0 15px}h1 span{color:#45d9ff}
.sub{color:#8490a4;font-size:14px;margin:0 auto 28px}.game{height:360px;position:relative;overflow:hidden;border:1px solid #ffffff18;border-radius:24px;background:radial-gradient(circle,#101d3a,#080c15 68%);touch-action:none}
.game:before{content:"";position:absolute;inset:0;opacity:.3;background-image:linear-gradient(#fff1 1px,transparent 1px),linear-gradient(90deg,#fff1 1px,transparent 1px);background-size:35px 35px}
.hint{position:absolute;top:15px;left:0;right:0;color:#667287;font-size:11px;pointer-events:none}
#btn{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border:0;border-radius:12px;padding:16px 25px;background:linear-gradient(135deg,#00cfff,#416fff);color:#fff;font-weight:850;font-size:15px;box-shadow:0 12px 35px #008cff55;transition:left .12s,top .12s;touch-action:none}
#win{display:none;position:absolute;inset:0;place-items:center;font-size:28px;font-weight:900}#win.show{display:grid}
.stats{margin-top:11px;color:#69758a;font-size:11px}.stats b{color:#fff}.links{margin-top:25px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.links a{padding:9px 13px;border:1px solid #ffffff12;border-radius:9px;color:#9ba6b8;font-size:11px;background:#ffffff05}.links a:hover{color:#fff;background:#ffffff0a}
.footer{margin-top:20px;color:#596579;font-size:10px}.footer b{color:#fff}
@media(max-width:600px){.wrap{width:92vw}.site{display:none}.game{height:380px}h1{letter-spacing:-2px}.sub{font-size:13px}.nav{margin-bottom:30px}}
</style>
</head>
<body>
<main class="wrap">
  <nav class="nav">
    <a class="brand" href="https://hdwebstudios.in/" target="_blank" rel="noopener noreferrer">
      <img class="logo" src="https://www.hdwebstudios.in/logo.png" alt="HD Web Studios logo">
      <span>HD WEB STUDIOS</span>
    </a>
    <a class="site" href="https://hdwebstudios.in/" target="_blank" rel="noopener noreferrer">hdwebstudios.in ↗</a>
  </nav>

  <div class="badge">WEB EXPERIMENT BY HD WEB STUDIOS</div>
  <h1>Try to <span>click</span> this button.</h1>
  <p class="sub">It has one job: <b>not getting clicked.</b> 👀</p>

  <section class="game" id="game">
    <div class="hint" id="hint">5 escapes to win · chase it</div>
    <button id="btn" type="button">Catch Me 👀</button>
    <div id="win">🎉 YOU GOT ME!</div>
  </section>

  <div class="stats">Escapes: <b id="count">0</b> / 5</div>

  <div class="links">
    <a href="https://hdwebstudios.in/" target="_blank" rel="noopener noreferrer">🌐 Website</a>
    <a href="https://wa.me/917589434135" target="_blank" rel="noopener noreferrer">💬 WhatsApp</a>
    <a href="mailto:harshdeep@hdwebstudios.in">✉ Email</a>
  </div>

  <div class="footer">© 2026 <b>HD Web Studios</b> · Ludhiana, Punjab</div>
</main>

<script>
const game=document.getElementById("game"),btn=document.getElementById("btn"),count=document.getElementById("count"),win=document.getElementById("win"),hint=document.getElementById("hint");
let escapes=0,done=false,last=0;const REQUIRED=5;

function move(x,y){
 if(done)return;
 const a=game.getBoundingClientRect(),b=btn.getBoundingClientRect(),cx=b.left+b.width/2,cy=b.top+b.height/2;
 let dx=cx-x,dy=cy-y,d=Math.hypot(dx,dy)||1;dx/=d;dy/=d;
 const dist=innerWidth<600?175:200,p=18,minX=p+b.width/2,maxX=a.width-p-b.width/2,minY=p+b.height/2,maxY=a.height-p-b.height/2;
 let nx=cx-a.left+dx*dist,ny=cy-a.top+dy*dist;
 if(nx<minX||nx>maxX){nx=cx-a.left-dy*dist;ny=cy-a.top+dx*dist}
 if(ny<minY||ny>maxY){nx=cx-a.left+dy*dist;ny=cy-a.top-dx*dist}
 nx=Math.max(minX,Math.min(maxX,nx));ny=Math.max(minY,Math.min(maxY,ny));
 btn.style.left=nx+"px";btn.style.top=ny+"px";escapes++;count.textContent=escapes;
 hint.textContent=escapes<REQUIRED?`${REQUIRED-escapes} more escapes · keep chasing`:"You can catch it now 👀";
}

function near(x,y){
 if(done)return;const b=btn.getBoundingClientRect(),r=innerWidth<600?175:155;
 if(Math.hypot(x-(b.left+b.width/2),y-(b.top+b.height/2))<r&&performance.now()-last>120){last=performance.now();move(x,y)}
}

game.addEventListener("mousemove",e=>near(e.clientX,e.clientY));
game.addEventListener("touchstart",e=>{let t=e.touches[0];if(t)near(t.clientX,t.clientY)},{passive:true});
game.addEventListener("touchmove",e=>{let t=e.touches[0];if(t)near(t.clientX,t.clientY)},{passive:true});

btn.addEventListener("pointerdown",e=>{
 e.preventDefault();e.stopPropagation();
 if(escapes<REQUIRED){move(e.clientX,e.clientY);return}
 done=true;btn.style.display="none";win.classList.add("show");hint.textContent="MISSION COMPLETE 🎉";
});
</script>
</body>
</html>
